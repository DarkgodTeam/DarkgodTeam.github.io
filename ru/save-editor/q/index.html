<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <script>
    (function () { try { if (!sessionStorage.getItem('kn-where')) location.replace('../index.html'); } catch (e) { location.replace('../index.html'); } })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex,nofollow">
  <title>WHERE</title>
  <link rel="icon" type="image/png" href="../game-sprites/spr_heart_0.png">
  <style>
    @font-face { font-family:'PixelOp'; src:url('../fonts/PixelOperator.woff2') format('woff2'); font-display:swap; }
    @font-face { font-family:'cs8bit'; src:url('../fonts/8bitOperatorPlus-Bold.ttf') format('truetype'); font-display:swap; }
    @font-face { font-family:'8bitOperatorJVE'; src:url('../fonts/8bitoperator_jve_v2_01.ttf') format('truetype'); font-display:swap; }
    html,body{margin:0;height:100%;background:#000;overflow:hidden;}
    body{display:flex;align-items:center;justify-content:center;font-family:'8bitOperatorJVE','PixelOp',monospace;}
    #wrap{display:flex;flex-direction:column;align-items:center;gap:0;}
    #pw{
      width:300px;max-width:80vw;background:#000;border:none;outline:none;color:#fff;
      font-family:inherit;font-size:40px;text-align:center;letter-spacing:14px;caret-color:#fff;
      padding:10px 0;
    }
    #pw::selection{background:#fff;color:#000;}
    #line{width:300px;max-width:80vw;height:3px;background:#fff;opacity:.85;}
    body.shake #wrap{animation:sh .35s linear;}
    @keyframes sh{0%,100%{transform:translateX(0);}20%{transform:translateX(-12px);}40%{transform:translateX(12px);}60%{transform:translateX(-8px);}80%{transform:translateX(8px);}}
    #scene{position:fixed;inset:0;display:none;background:#000;}
    #scene canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;image-rendering:pixelated;}
    #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s linear;z-index:50;}
    #fade.on{opacity:1;}
  </style>
</head>
<body>
  <div id="wrap">
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="4" aria-label="">
    <div id="line"></div>
  </div>
  <div id="scene"></div>
  <div id="fade"></div>

  <script src="seed.js"></script>
  <script src="../assets/js/knight-transition.js" data-auto="off" data-sound="on"></script>
  <script src="../assets/i/cache/december/m/room-data.js"></script>
  <script src="../assets/i/cache/december/dec.js"></script>
  <script src="where.js"></script>
</body>
</html>
