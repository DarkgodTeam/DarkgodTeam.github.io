  <style>
    @font-face { font-family: '8bitOperatorPlus-Bold'; src: url('../assets/fonts/8bitOperatorPlus-Bold.ttf') format('truetype'); font-display: block; }
    @font-face { font-family: '8bitOperatorPlus'; src: url('../assets/fonts/8bitOperatorPlus-Regular.ttf') format('truetype'); font-display: block; }
    :root { --yellow:#FFFF00; --blue:#342DB5; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { min-height: 100vh; background: #05040f; color: #fff; font-family: '8bitOperatorPlus', monospace; overflow-x: hidden; }
    .site-nav a, .site-nav .font-8bit a, .site-nav>div>ul:first-child { font-family: '8bitOperatorPlus-Bold', monospace !important; }
    .site-nav { background: #420042 !important; box-shadow: 0 1px 0 rgba(255,255,255,.08); }
    img { image-rendering: auto; }

    /* ===== Cyberworld battle background (Ch.2, obj_battleback Draw):
       two tiled bg_battleback1 layers drifting in opposite diagonals.
       Tile is 50x50; cycle exactly one tile so loop is mathematically seamless
       and we animate background-position (no GPU layer restart hitch). */
    .bg { position: fixed; inset: 0; z-index: -3; background: #000; }
    .cyberbg { position: fixed; inset: 0; z-index: -2; pointer-events: none; overflow: hidden; }
    .cyberbg b { position: absolute; inset: 0;
        background-image: url('assets/bg_battleback1_0.png');
        background-repeat: repeat;
        background-size: 50px 50px;
        image-rendering: pixelated;
        will-change: background-position; }
    /* siner  +0.5/tick @30fps = 15 px/sec → 50px / 3.33s (layer A, fainter, drifts ⬊) */
    .cyberbg b.a { opacity: .5; animation: cyber-a 3.333s linear infinite; }
    /* siner2 +1/tick   @30fps = 30 px/sec → 50px / 1.66s (layer B, full, drifts ⬉) */
    .cyberbg b.b { opacity: 1;  animation: cyber-b 1.667s linear infinite; }
    @keyframes cyber-a { from { background-position:  0  0;     } to { background-position:  50px  50px; } }
    @keyframes cyber-b { from { background-position:  0  0;     } to { background-position: -50px -50px; } }
    @media (prefers-reduced-motion: reduce) { .cyberbg b { animation: none !important; } }

    /* ===== Layout: bulletproof centered column ===== */
    .page { width: 100%; min-height: calc(100vh - 48px); display: flex; flex-direction: column;
        align-items: center; padding: 56px 20px 60px; gap: 0; }
    .page > * { width: 100%; max-width: 1760px; }

    .team-head { text-align: center; margin: 0 0 40px; }
    .team-head h1 { margin: 0; font-family: '8bitOperatorPlus-Bold', monospace;
        font-size: clamp(1.4rem, 4vw, 2rem); letter-spacing: 6px;
        color: #9b95d6; text-shadow: 2px 2px 0 #000; }
    .team-head .divider { display: flex; justify-content: center; margin-top: 18px; }
    .team-head .divider img { width: 20px; height: 20px; filter: drop-shadow(0 0 8px rgba(255,40,60,.6)); }

    /* ===== Section heading ===== */
    .sec-title { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 36px 0 22px; }
    .sec-title::before, .sec-title::after { content: ""; width: 46px; height: 3px; background: #4a4470; }
    .sec-title span { font-family: '8bitOperatorPlus-Bold', monospace; font-size: clamp(1.2rem, 3.6vw, 1.55rem); letter-spacing: 2px; color: #fff; white-space: nowrap; }
    .sec-title span b { color: var(--yellow); }

    .row { width: 100%; display: flex; flex-wrap: wrap; gap: 22px;
        justify-content: center; align-items: flex-start; margin: 0 auto; }

    .card { position: relative; flex: 0 0 408px; width: 408px; max-width: 100%;
        opacity: 0; transform: translateY(14px); animation: rise .5s ease forwards;
        transition: transform .15s ease, filter .15s ease; }
    @keyframes rise { to { opacity: 1; transform: none; } }
    .card .box { width: 100% !important; height: auto !important; display: block; image-rendering: pixelated; }
    .card:hover { transform: translateY(-4px);
        filter: drop-shadow(0 10px 16px rgba(0,0,0,.55)) drop-shadow(0 0 10px var(--accent, #fff)); }

    .overlay { position: absolute; left: 7%; right: 3.6%; top: 12%; bottom: 12%;
        display: flex; align-items: center; gap: 15px; z-index: 2; }
    .ava { width: 70px !important; height: 70px !important; flex: 0 0 auto; border-radius: 8px; overflow: hidden;
        background: transparent; }
    .ava.no-radius { border-radius: 0; }
    .ava img, .ava video { width: 100% !important; height: 100% !important; max-width: none !important; object-fit: cover !important; object-position: center; display: block; image-rendering: auto !important; }
    .meta { min-width: 0; flex: 1 1 auto; padding-right: 0; }
    .cname { margin: 0; font-family: '8bitOperatorPlus-Bold', monospace; font-size: 1.34rem; line-height: 1.05; letter-spacing: .5px; word-break: break-word; }
    .ccomment { margin: 5px 0 0; font-size: .74rem; line-height: 1.3; color: #ececff;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ccomment.small-wrap { max-width: 230px; font-size: .62rem; line-height: 1.14; overflow: visible; text-overflow: clip; white-space: normal; }

    .corner { position: absolute; right: 5%; bottom: 15%; z-index: 3; display: flex; gap: 12px; align-items: flex-end; justify-content: flex-end; max-width: 230px; }
    .corner .role, .corner a { font-family: '8bitOperatorPlus-Bold', monospace; font-size: .59rem; line-height: 1.04; letter-spacing: .3px; color: var(--yellow); text-align: right; }
    .corner .role { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
    .corner .role.shift-left { transform: translateX(-4px); }
    .corner .role span { display: block; white-space: nowrap; }
    .corner a { text-decoration: none; }
    .corner a:hover { text-decoration: underline; }
@media (max-width: 760px) {
      .row { max-width: 408px; }
      .meta { padding-right: 0; }
    }
    @media (max-width: 430px) {
      .ava { width: 58px !important; height: 58px !important; }
      .cname { font-size: 1.12rem; }
      .ccomment { font-size: .68rem; }
      .corner { max-width: 200px; bottom: 14%; }
      .corner .role, .corner a { font-size: .52rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stars { animation: none !important; }
      .card { opacity: 1 !important; transform: none !important; animation: none !important; }
    }
  </style>

</main>

<script>
(function () {
  var FALLBACK = '../save-editor/game-sprites/spr_heart_0.png';
  var BOX_ACCENT = {
    boxtrad:'#E94C3D', boxhappy:'#00FF00', boxaudio:'#07D1FF',
    boxbeta:'#72358B', boxmario:'#A5A5E7',
    box_black:'#000000', box_pink:'#FF66BB', box_randold:'#FF91A4',
    box_pxch:'#db4161', box_reski:'#8cfab6',
    box_neonite:'#c5d0e6', box_loredeveloper:'#2170f4',
    box_markwolf:'#fef200'
  };

  var SECTIONS = [
    {
      title: 'ВЛАДЕЛЕЦ',
      members: [
        { name: 'Px-Ch', avatar: 'avatars/px-ch.mp4', media: 'video', comment: 'Я обязательно всё переведу...', role: 'Организация, редактура, перевод, графика', box: 'box_pxch' }
      ]
    },
    {
      title: 'УЧАСТНИКИ',
      members: [
        { name: 'Dess1225', avatar: 'avatars/dess1225.jpg', comment: 'Православный интернет', role: 'Гайдзин', noRoleShift: true, box: 'box_black' },
        { name: 'Киря :3', avatar: 'avatars/kirya-3.svg', comment: 'Из вас излучается сила пушистиков.', role: 'Код, генерация идей, перевод, маскот команды', roleBreakBefore: 2, box: 'box_pink' },
        { name: 'MarkWolf', avatar: 'avatars/markwolf.png', avatarClass: 'no-radius', comment: 'Друг', role: 'Тестирование, генерация идей, соцсети', box: 'box_markwolf' },
        { name: 'Randold', avatar: 'avatars/randold.png', comment: 'Мешал', role: 'Генерация идей, талисман команды', box: 'box_randold' },
        { name: 'iwontbeforgotten (Reski)', avatar: 'avatars/reski.png', comment: 'Она такая одна! (С приветом!)', role: 'Перевод, звук, генерация идей', box: 'box_reski' },
        { name: 'NeoNite', avatar: 'avatars/neonite.jpg', comment: 'The man who Jacked all Trades...', role: 'Тестирование, генерация идей', box: 'box_neonite' },
        { name: 'LoreDeveloper', avatar: 'avatars/loredeveloper.jpg', comment: 'Любимое занятие — сталкивать телеведущих с лестниц.', commentClass: 'small-wrap', role: '3D-графика, генерация идей', box: 'box_loredeveloper' }
      ]
    }
  ];

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function roleHTML(role, breakBefore) {
    var text = String(role || '');
    if (text.length <= 'Тестирование, генерация идей'.length) return '<span>' + esc(text) + '</span>';
    var parts = text.split(', ');
    if (parts.length < 2) return '<span>' + esc(text) + '</span>';
    if (breakBefore > 0 && breakBefore < parts.length) {
      return '<span>' + esc(parts.slice(0, breakBefore).join(', ') + ',') + '</span>' +
        '<span>' + esc(parts.slice(breakBefore).join(', ')) + '</span>';
    }
    var lines = [[]];
    parts.forEach(function (part) {
      var current = lines[lines.length - 1];
      var next = current.concat(part).join(', ');
      if (!current.length || next.length <= 'Тестирование, генерация идей'.length) current.push(part);
      else lines.push([part]);
    });
    if (lines.length > 2) lines = [lines[0], lines.slice(1).reduce(function (all, line) { return all.concat(line); }, [])];
    return lines.map(function (line, i) {
      return '<span>' + esc(line.join(', ') + (i < lines.length - 1 ? ',' : '')) + '</span>';
    }).join('');
  }

  var root = document.getElementById('sections');
  var idx = 0;

  SECTIONS.forEach(function (sec) {
    if (sec.title) {
      var h = document.createElement('div');
      h.className = 'sec-title';
      h.innerHTML = '<span>' + esc(sec.title) + '</span>';
      root.appendChild(h);
    }

    var row = document.createElement('div');
    row.className = 'row';
    root.appendChild(row);

    sec.members.forEach(function (m) {
      var box = m.box || sec.box || 'boxtrad';
      var card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('data-box', box);
      card.style.setProperty('--accent', m.accent || BOX_ACCENT[box] || '#fff');
      card.style.animationDelay = (idx++ * 80) + 'ms';

      var corner = '';
      if (m.role) corner += '<span class="role' + (m.noRoleShift ? '' : ' shift-left') + '">' + roleHTML(m.role, m.roleBreakBefore) + '</span>';
      (m.links || []).forEach(function (l) {
        corner += '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a>';
      });

      var media = m.media === 'video'
        ? '<video src="' + esc(m.avatar) + '" autoplay muted loop playsinline></video>'
        : '<img src="' + esc(m.avatar) + '" alt="' + esc(m.name) + '" onerror="this.onerror=null;this.src=\'' + FALLBACK + '\';this.style.padding=\'16px\';">';

      card.innerHTML =
        '<img class="box" src="box/' + box + '.png" alt="">' +
        '<div class="overlay">' +
          '<div class="ava' + (m.avatarClass ? ' ' + esc(m.avatarClass) : '') + '">' + media + '</div>' +
          '<div class="meta">' +
            '<h3 class="cname">' + esc(m.name) + '</h3>' +
            (m.comment ? '<p class="ccomment' + (m.commentClass ? ' ' + esc(m.commentClass) : '') + '">* ' + esc(m.comment) + '</p>' : '') +
          '</div>' +
        '</div>' +
        (corner ? '<div class="corner">' + corner + '</div>' : '');
      row.appendChild(card);
    });
  });
})();
</script>
